name: Publish internal Android release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Play version code (must increase)
        required: true
      version_name:
        description: User-facing version
        required: true
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.FRANK_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/frank-upload.jks"
      - name: Build signed bundle
        env:
          FRANK_UPLOAD_KEYSTORE: ${{ runner.temp }}/frank-upload.jks
          FRANK_UPLOAD_STORE_PASSWORD: ${{ secrets.FRANK_UPLOAD_STORE_PASSWORD }}
          FRANK_UPLOAD_KEY_ALIAS: ${{ secrets.FRANK_UPLOAD_KEY_ALIAS }}
          FRANK_UPLOAD_KEY_PASSWORD: ${{ secrets.FRANK_UPLOAD_KEY_PASSWORD }}
        run: |
          code="${{ inputs.version_code }}"
          name="${{ inputs.version_name }}"
          if [[ -z "$code" ]]; then code="${GITHUB_REF_NAME#android-v}"; code="${code//./}"; fi
          if [[ -z "$name" ]]; then name="${GITHUB_REF_NAME#android-v}"; fi
          ./gradlew bundleRelease -PfrankVersionCode="$code" -PfrankVersionName="$name" \
            -PfrankServerUrl="${{ secrets.FRANK_SERVER_URL }}" \
            -PfrankAccessToken="${{ secrets.FRANK_ACCESS_TOKEN }}"
      - name: Upload bundle and Play listing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          bundle exec fastlane android internal json_key:"$RUNNER_TEMP/play-service-account.json"
