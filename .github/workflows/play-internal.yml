name: Publish internal Android release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Play version code (must increase)
        required: true
      version_name:
        description: User-facing version
        required: true
  push:
    branches:
      - main
    tags:
      - 'android-v*'

concurrency:
  group: play-internal-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.FRANK_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/frank-upload.jks"
      - name: Build signed bundle
        env:
          FRANK_UPLOAD_KEYSTORE: ${{ runner.temp }}/frank-upload.jks
          FRANK_UPLOAD_STORE_PASSWORD: ${{ secrets.FRANK_UPLOAD_STORE_PASSWORD }}
          FRANK_UPLOAD_KEY_ALIAS: ${{ secrets.FRANK_UPLOAD_KEY_ALIAS }}
          FRANK_UPLOAD_KEY_PASSWORD: ${{ secrets.FRANK_UPLOAD_KEY_PASSWORD }}
          FRANK_SERVER_URL_RAW: ${{ secrets.FRANK_SERVER_URL }}
          FRANK_ACCESS_TOKEN_RAW: ${{ secrets.FRANK_ACCESS_TOKEN }}
        run: |
          code="${{ inputs.version_code }}"
          name="${{ inputs.version_name }}"
          if [[ -z "$code" ]]; then code=$((200000 + GITHUB_RUN_NUMBER)); fi
          if [[ -z "$name" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
              name="${GITHUB_REF_NAME#android-v}"
            else
              name="1.0.${GITHUB_RUN_NUMBER}"
            fi
          fi
          server_url=$(printf '%s' "$FRANK_SERVER_URL_RAW" | tr -d '\r\n')
          access_token=$(printf '%s' "$FRANK_ACCESS_TOKEN_RAW" | tr -d '\r\n')
          ./gradlew bundleRelease -PfrankVersionCode="$code" -PfrankVersionName="$name" \
            -PfrankServerUrl="$server_url" \
            -PfrankAccessToken="$access_token"
      - name: Upload bundle and Play listing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          bundle exec fastlane android internal json_key:"$RUNNER_TEMP/play-service-account.json"
